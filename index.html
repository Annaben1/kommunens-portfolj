<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kommunens initiativportfölj</title>
  <style>
    :root {
      --bg: #f3f7ff;
      --bg-2: #edf3ff;
      --card: rgba(255,255,255,0.96);
      --panel: #f9fbff;
      --text: #162233;
      --muted: #5d6d84;
      --line: #deeaf9;
      --primary: #1f63ff;
      --primary-dark: #174fd0;
      --primary-soft: #edf5ff;
      --success: #1f8f5f;
      --success-soft: #ebfaf2;
      --warning: #b66c05;
      --warning-soft: #fff5e5;
      --danger: #c45151;
      --danger-soft: #fff0f0;
      --shadow: 0 18px 42px rgba(24, 41, 68, 0.08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    body {
      padding: 18px 14px 32px;
    }

    .app {
      max-width: 820px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding: 4px 4px 0;
    }

    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
      margin: 0 0 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(31, 99, 255, 0.09);
      color: var(--primary-dark);
      border: 1px solid rgba(31,99,255,0.12);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 0.72rem;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 5vw, 2.9rem);
      line-height: 1.08;
      letter-spacing: -0.05em;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .summary-card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 16px 14px;
      overflow: hidden;
    }

    .summary-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), rgba(31,99,255,0.3));
    }

    .summary-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    .summary-value {
      margin: 0;
      font-size: clamp(1.15rem, 2.9vw, 1.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .kpi-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 14px 12px;
    }

    .kpi-label {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0;
    }

    .card {
      background: rgba(255,255,255,0.96);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 16px;
      margin-bottom: 18px;
      backdrop-filter: blur(10px);
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 1.18rem;
      letter-spacing: -0.03em;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .search-input {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 12px 14px;
      font-size: 0.98rem;
      color: var(--text);
      outline: none;
    }

    .search-input:focus {
      border-color: rgba(31,99,255,0.9);
      box-shadow: 0 0 0 4px rgba(31,99,255,0.12);
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn:active { transform: translateY(1px); }

    .primary-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 14px 24px rgba(31,99,255,0.18);
    }

    .secondary-btn {
      background: #edf3ff;
      color: var(--primary-dark);
      border: 1px solid #dbe9ff;
    }

    .danger-btn {
      background: #fff0f0;
      color: #b92d2d;
      border: 1px solid #ffd7d7;
    }

    form {
      display: grid;
      gap: 12px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.9);
      border-radius: 14px;
      padding: 12px 13px;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(31,99,255,0.9);
      box-shadow: 0 0 0 4px rgba(31,99,255,0.12);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .item {
      background: linear-gradient(180deg, #fbfdff 0%, #ffffff 100%);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 12px 28px rgba(17,24,39,0.04);
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .item-name {
      margin: 0;
      font-size: 1.04rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .meta {
      color: var(--muted);
      font-size: 0.72rem;
      margin-top: 4px;
      line-height: 1.45;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 7px 9px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 800;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .status-planerad {
      background: var(--primary-soft);
      color: var(--primary-dark);
      border-color: #dfeaff;
    }

    .status-pagar {
      background: var(--success-soft);
      color: var(--success);
      border-color: #d8f4e3;
    }

    .status-pausad {
      background: var(--warning-soft);
      color: var(--warning);
      border-color: #f7e0b7;
    }

    .status-avslutad {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: #ffd9d9;
    }

    .description {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
      margin: 0 0 12px;
    }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .mini {
      background: rgba(255,255,255,0.8);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 10px;
    }

    .mini-label {
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .mini-value {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .delete-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 10px 12px;
      background: #fee7e7;
      color: #a12a2a;
      font-weight: 800;
      cursor: pointer;
    }

    .risk-box {
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(245,248,255,0.9));
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 10px;
      margin-top: 8px;
    }

    .risk-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .risk-label {
      font-size: 0.62rem;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    .risk-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 0.66rem;
      font-weight: 800;
      border: 1px solid transparent;
    }

    .risk-lag {
      background: #edfdf3;
      color: #1f8f5f;
      border-color: #d7f0e0;
    }

    .risk-medel {
      background: #fff7e8;
      color: #b66c05;
      border-color: #f7dfaa;
    }

    .risk-hog {
      background: #fff0f0;
      color: #c45151;
      border-color: #ffdada;
    }

    .effect-box {
      background: rgba(31,99,255,0.03);
      border: 1px solid rgba(31,99,255,0.08);
      border-radius: 12px;
      padding: 9px 10px;
      margin-top: 8px;
    }

    .effect-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text);
      margin-bottom: 6px;
    }

    .progress-wrap {
      width: 100%;
      background: #edf2f9;
      border-radius: 999px;
      height: 9px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #6aa3ff);
      border-radius: 999px;
    }

    @media (max-width: 420px) {
      .summary-grid, .grid-2, .filter-row, .item-grid, .kpi-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Kommunens initiativportfölj</p>
        <h1>Projekt &amp; satsningar</h1>
      </div>
      <span class="tag">Dashboard</span>
    </header>

    <section class="summary-grid">
      <div class="summary-card">
        <p class="summary-label">Total budget</p>
        <p class="summary-value" id="totalBudget">0 kr</p>
      </div>

      <div class="summary-card">
        <p class="summary-label">Förbrukat</p>
        <p class="summary-value" id="totalForbrukat">0 kr</p>
      </div>

      <div class="summary-card">
        <p class="summary-label">Kvarvarande</p>
        <p class="summary-value" id="kvarvarande">0 kr</p>
      </div>

      <div class="summary-card">
        <p class="summary-label">Aktiva</p>
        <p class="summary-value" id="aktiva">0</p>
      </div>
    </section>

    <section class="kpi-grid">
      <div class="kpi-box">
        <div class="kpi-label">Planerade</div>
        <p class="kpi-value" id="planerade">0</p>
      </div>
      <div class="kpi-box">
        <div class="kpi-label">Pågående</div>
        <p class="kpi-value" id="pagarande">0</p>
      </div>
      <div class="kpi-box">
        <div class="kpi-label">Avslutade</div>
        <p class="kpi-value" id="avslutade">0</p>
      </div>
    </section>

    <section class="card">
      <h2>Filtrera och sök</h2>

      <div class="toolbar">
        <input id="searchInput" class="search-input" type="text" placeholder="Sök på namn, kategori, avdelning eller ansvarig" />
        <div class="filter-row">
          <select id="statusFilter">
            <option>Alla</option>
            <option>Planerad</option>
            <option>Pågår</option>
            <option>Pausad</option>
            <option>Avslutad</option>
          </select>

          <select id="kategoriFilter">
            <option>Alla</option>
            <option>Barn och unga</option>
            <option>IT och digitalisering</option>
            <option>Miljö</option>
            <option>Samhällsbyggnad</option>
            <option>Kultur</option>
          </select>
        </div>
      </div>

      <div class="action-row">
        <button class="btn secondary-btn" id="exportBtn" type="button">Exportera CSV</button>
        <button class="btn danger-btn" id="resetBtn" type="button">Rensa data</button>
      </div>
    </section>

    <section class="card">
      <h2>Lägg till initiativ</h2>

      <form id="form">
        <label>
          Namn
          <input id="namn" type="text" placeholder="Ex: Tryggare skolvägar" />
        </label>

        <div class="grid-2">
          <label>
            Kategori
            <select id="kategori">
              <option>Barn och unga</option>
              <option>IT och digitalisering</option>
              <option>Miljö</option>
              <option>Samhällsbyggnad</option>
              <option>Kultur</option>
            </select>
          </label>

          <label>
            Status
            <select id="status">
              <option>Planerad</option>
              <option>Pågår</option>
              <option>Pausad</option>
              <option>Avslutad</option>
            </select>
          </label>
        </div>

        <div class="grid-2">
          <label>
            Avdelning
            <input id="avdelning" type="text" placeholder="Ex: Samhällsbyggnad" />
          </label>

          <label>
            Ansvarig
            <input id="ansvarig" type="text" placeholder="Ex: Anna Nilsson" />
          </label>
        </div>

        <div class="grid-2">
          <label>
            Budget (kr)
            <input id="budget" type="number" value="0" />
          </label>

          <label>
            Förbrukat (kr)
            <input id="forbrukat" type="number" value="0" />
          </label>
        </div>

        <div class="grid-2">
          <label>
            Startdatum
            <input id="startDatum" type="date" />
          </label>

          <label>
            Slutdatum
            <input id="slutDatum" type="date" />
          </label>
        </div>

        <div class="grid-2">
          <label>
            Risknivå
            <select id="riskNiva">
              <option>Låg</option>
              <option>Medel</option>
              <option>Hög</option>
            </select>
          </label>

          <label>
            Effektstatus
            <select id="effektStatus">
              <option>På plan</option>
              <option>Delvis uppnådd</option>
              <option>Uppnådd</option>
              <option>Ej startad</option>
            </select>
          </label>
        </div>

        <label>
          Riskbeskrivning
          <textarea id="riskBeskrivning" placeholder="Beskriv risk och konsekvens..."></textarea>
        </label>

        <label>
          Riskåtgärd
          <textarea id="riskAtgard" placeholder="Vilken åtgärd planeras?..."></textarea>
        </label>

        <label>
          Effektmål / KPI
          <input id="effektMal" type="text" placeholder="Ex: Minska antalet resor med bil med 15%" />
        </label>

        <div class="grid-2">
          <label>
            Basvärde
            <input id="basVarde" type="number" value="0" />
          </label>

          <label>
            Målvärde
            <input id="malVarde" type="number" value="0" />
          </label>
        </div>

        <label>
          Beskrivning
          <textarea id="beskrivning" placeholder="Kort beskrivning av initiativet..."></textarea>
        </label>

        <button class="btn primary-btn" type="submit">Lägg till initiativ</button>
      </form>
    </section>

    <section class="card">
      <h2>Initiativlista</h2>
      <div id="list" class="list"></div>
    </section>
  </div>

  <script>
    const storageKey = 'kommunInitiativData';

    const initialProjects = [
      {
        id: 1,
        namn: 'Tryggare skolvägar',
        kategori: 'Barn och unga',
        avdelning: 'Samhällsbyggnad',
        ansvarigPerson: 'Anna Nilsson',
        status: 'Pågår',
        budget: 450000,
        forbrukat: 210000,
        startDatum: '2026-01-15',
        slutDatum: '2026-12-31',
        riskNiva: 'Medel',
        riskBeskrivning: 'Trafikbelastning och omstrukturering i centrala kvarter kan påverka genomförandet.',
        riskAtgard: 'Fördjupad samordning med skolor, fastighetsägare och trafikplanering.',
        effektMal: 'Minska olycksrisk och öka tryggheten i skolvägar',
        basVarde: 70,
        malVarde: 90,
        effektStatus: 'På plan',
        beskrivning: 'Ökad trygghet runt skolvägar i centrala bostadsområden.'
      },
      {
        id: 2,
        namn: 'Digital service för invånare',
        kategori: 'IT och digitalisering',
        avdelning: 'IT',
        ansvarigPerson: 'Lars Eriksson',
        status: 'Planerad',
        budget: 800000,
        forbrukat: 120000,
        startDatum: '2026-03-01',
        slutDatum: '2027-06-30',
        riskNiva: 'Låg',
        riskBeskrivning: 'Långsammare adoption än planerat om tjänsten inte är lättillgänglig för medborgarna.',
        riskAtgard: 'User testing och justering av digitala tjänster innan lansering.',
        effektMal: 'Öka digital serviceanvändning bland medborgare',
        basVarde: 45,
        malVarde: 75,
        effektStatus: 'Delvis uppnådd',
        beskrivning: 'Förbättra digitala tjänster för medborgare och verksamheter.'
      },
      {
        id: 3,
        namn: 'Klimatvänligt gatunät',
        kategori: 'Miljö',
        avdelning: 'Teknik och miljö',
        ansvarigPerson: 'Maja Karlsson',
        status: 'Avslutad',
        budget: 300000,
        forbrukat: 300000,
        startDatum: '2025-05-10',
        slutDatum: '2026-02-28',
        riskNiva: 'Hög',
        riskBeskrivning: 'Väderförhållanden och leveransförseningar kunde påverka genomförandet.',
        riskAtgard: 'Byggfasplanering och reservtidsplan.',
        effektMal: 'Minska klimatpåverkan och förbättra grönstruktur',
        basVarde: 40,
        malVarde: 70,
        effektStatus: 'Uppnådd',
        beskrivning: 'Trädplantering och grön struktur runt gångvägar och cykelvägar.'
      }
    ];

    let projects = JSON.parse(localStorage.getItem(storageKey)) || initialProjects;

    function saveProjects() {
      localStorage.setItem(storageKey, JSON.stringify(projects));
    }

    function formatMoney(num) {
      return Number(num || 0).toLocaleString('sv-SE') + ' kr';
    }

    function statusClass(status) {
      const normalized = status.toLowerCase().replace(/\s+/g, '-');
      return 'status-' + normalized;
    }

    function riskClass(level) {
      if (level === 'Låg') return 'risk-lag';
      if (level === 'Medel') return 'risk-medel';
      return 'risk-hog';
    }

    function renderSummary() {
      const totalBudget = projects.reduce((sum, p) => sum + Number(p.budget || 0), 0);
      const totalForbrukat = projects.reduce((sum, p) => sum + Number(p.forbrukat || 0), 0);
      const kvarvarande = totalBudget - totalForbrukat;
      const aktiva = projects.filter(p => p.status === 'Pågår' || p.status === 'Planerad').length;
      const planerade = projects.filter(p => p.status === 'Planerad').length;
      const pagarande = projects.filter(p => p.status === 'Pågår').length;
      const avslutade = projects.filter(p => p.status === 'Avslutad').length;

      document.getElementById('totalBudget').textContent = formatMoney(totalBudget);
      document.getElementById('totalForbrukat').textContent = formatMoney(totalForbrukat);
      document.getElementById('kvarvarande').textContent = formatMoney(kvarvarande);
      document.getElementById('aktiva').textContent = aktiva;
      document.getElementById('planerade').textContent = planerade;
      document.getElementById('pagarande').textContent = pagarande;
      document.getElementById('avslutade').textContent = avslutade;
    }

    function getFilteredProjects() {
      const searchValue = document.getElementById('searchInput').value.trim().toLowerCase();
      const statusValue = document.getElementById('statusFilter').value;
      const categoryValue = document.getElementById('kategoriFilter').value;

      return projects.filter(project => {
        const matchesStatus = statusValue === 'Alla' || project.status === statusValue;
        const matchesCategory = categoryValue === 'Alla' || project.kategori === categoryValue;
        const searchable = [
          project.namn,
          project.kategori,
          project.avdelning,
          project.ansvarigPerson,
          project.beskrivning,
          project.riskBeskrivning,
          project.effektMal
        ].join(' ').toLowerCase();

        const matchesSearch = !searchValue || searchable.includes(searchValue);
        return matchesStatus && matchesCategory && matchesSearch;
      });
    }

    function renderList() {
      const filtered = getFilteredProjects();
      const list = document.getElementById('list');

      if (!filtered.length) {
        list.innerHTML = '<div class="item"><p class="description">Inga initiativ matchar din sökning eller filtrering.</p></div>';
        return;
      }

      list.innerHTML = filtered.map(project => {
        const remaining = Number(project.budget || 0) - Number(project.forbrukat || 0);
        const baseline = Number(project.basVarde ?? 0);
        const target = Number(project.malVarde ?? 0);
        const progress = target > 0 ? Math.min(100, Math.round(((baseline + target) / 2) / target * 100)) : 0;

        return `
          <div class="item">
            <div class="item-top">
              <div>
                <p class="item-name">${project.namn}</p>
                <div class="meta">${project.kategori} • ${project.avdelning || 'Ej angiven'}</div>
              </div>
              <span class="status-badge ${statusClass(project.status)}">${project.status}</span>
            </div>

            <p class="description">${project.beskrivning || 'Ingen beskrivning angiven.'}</p>

            <div class="item-grid">
              <div class="mini">
                <div class="mini-label">Budget</div>
                <div class="mini-value">${formatMoney(project.budget)}</div>
              </div>

              <div class="mini">
                <div class="mini-label">Förbrukat</div>
                <div class="mini-value">${formatMoney(project.forbrukat)}</div>
              </div>
            </div>

            <div class="item-grid">
              <div class="mini">
                <div class="mini-label">Kvar</div>
                <div class="mini-value">${formatMoney(remaining)}</div>
              </div>

              <div class="mini">
                <div class="mini-label">Ansvarig</div>
                <div class="mini-value">${project.ansvarigPerson || '-'}</div>
              </div>
            </div>

            <div class="risk-box">
              <div class="risk-line">
                <span class="risk-label">Risk</span>
                <span class="risk-pill ${riskClass(project.riskNiva || 'Låg')}">${project.riskNiva || 'Låg'}</span>
              </div>
              <div class="risk-label">Beskrivning</div>
              <div class="description" style="margin: 6px 0 0;">${project.riskBeskrivning || 'Ingen riskbeskrivning.'}</div>
              <div class="risk-line" style="margin-top:8px;">
                <span class="risk-label">Åtgärd</span>
              </div>
              <div class="description" style="margin: 6px 0 0;">${project.riskAtgard || 'Ingen åtgärd angiven.'}</div>
            </div>

            <div class="effect-box">
              <div class="effect-line">
                <span><strong>KPI</strong></span>
                <span>${project.effektStatus || 'Ej satt'}</span>
              </div>
              <div class="effect-line">
                <span>${project.effektMal || 'Inget effektmål'}</span>
              </div>
              <div class="effect-line">
                <span>Bas: ${baseline}</span>
                <span>Mål: ${target}</span>
              </div>
              <div class="progress-wrap">
                <div class="progress-bar" style="width: ${progress}%"></div>
              </div>
            </div>

            <button class="delete-btn" data-id="${project.id}">Ta bort</button>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', event => {
          const id = Number(event.target.dataset.id);
          projects = projects.filter(project => project.id !== id);
          saveProjects();
          render();
        });
      });
    }

    function exportCSV() {
      const rows = [
        ['Namn', 'Kategori', 'Avdelning', 'Ansvarig', 'Status', 'Budget', 'Förbrukat', 'Kvar', 'Risknivå', 'Riskbeskrivning', 'Riskåtgärd', 'Effektmål', 'Basvärde', 'Målvärde', 'Effektstatus', 'Startdatum', 'Slutdatum', 'Beskrivning']
      ];

      projects.forEach(project => {
        const kvar = Number(project.budget || 0) - Number(project.forbrukat || 0);
        rows.push([
          project.namn,
          project.kategori,
          project.avdelning,
          project.ansvarigPerson,
          project.status,
          project.budget,
          project.forbrukat,
          kvar,
          project.riskNiva || 'Låg',
          project.riskBeskrivning || '',
          project.riskAtgard || '',
          project.effektMal || '',
          project.basVarde || 0,
          project.malVarde || 0,
          project.effektStatus || 'Ej satt',
          project.startDatum,
          project.slutDatum,
          project.beskrivning || ''
        ]);
      });

      const csv = rows.map(row => row.map(value => `"${String(value ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'kommunens-initiativportfolj.csv';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function render() {
      renderSummary();
      renderList();
    }

    document.getElementById('form').addEventListener('submit', function (event) {
      event.preventDefault();

      const namn = document.getElementById('namn').value.trim();
      if (!namn) return;

      const project = {
        id: Date.now(),
        namn,
        kategori: document.getElementById('kategori').value,
        avdelning: document.getElementById('avdelning').value.trim(),
        ansvarigPerson: document.getElementById('ansvarig').value.trim(),
        status: document.getElementById('status').value,
        budget: Number(document.getElementById('budget').value || 0),
        forbrukat: Number(document.getElementById('forbrukat').value || 0),
        startDatum: document.getElementById('startDatum').value,
        slutDatum: document.getElementById('slutDatum').value,
        riskNiva: document.getElementById('riskNiva').value,
        riskBeskrivning: document.getElementById('riskBeskrivning').value.trim(),
        riskAtgard: document.getElementById('riskAtgard').value.trim(),
        effektMal: document.getElementById('effektMal').value.trim(),
        basVarde: Number(document.getElementById('basVarde').value || 0),
        malVarde: Number(document.getElementById('malVarde').value || 0),
        effektStatus: document.getElementById('effektStatus').value,
        beskrivning: document.getElementById('beskrivning').value.trim()
      };

      projects.unshift(project);
      saveProjects();
      document.getElementById('form').reset();
      render();
    });

    document.getElementById('searchInput').addEventListener('input', renderList);
    document.getElementById('statusFilter').addEventListener('change', renderList);
    document.getElementById('kategoriFilter').addEventListener('change', renderList);
    document.getElementById('exportBtn').addEventListener('click', exportCSV);
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('Är du säker på att du vill rensa all data?')) {
        projects = [];
        saveProjects();
        render();
      }
    });

    render();
  </script>
</body>
</html>
